{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login-caixa cartao">
  <h1>Entrar</h1>
  <form method="post">
    {% csrf_token %}
    {% include "includes/form.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
  </form>
  <p><small>Use seu CPF ou sua matrícula.</small></p>
</div>
{% endblock %}
