{# Renderização padrão de um formulário Django: rótulo, campo, ajuda e erros. #}
{% if form.non_field_errors %}<div class="alerta error">{{ form.non_field_errors }}</div>{% endif %}
{% for campo in form %}
  <div class="campo{% if campo.errors %} com-erro{% endif %}">
    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% if campo.help_text %}<small>{{ campo.help_text }}</small>{% endif %}
    {{ campo.errors }}
  </div>
{% endfor %}
